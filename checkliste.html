<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wartungs-Checkliste</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { text-align: center; }
    input { font-size: 18px; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ddd; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>Wartungs-Checkliste</h1>
  <input id="punkt" type="text" placeholder="Neuer Punkt, z. B. Ölstand prüfen">
  <button onclick="hinzufuegen()">Hinzufügen</button>
  <ul id="liste"></ul>

  <script>
    function hinzufuegen() {
      const text = document.getElementById("punkt").value.trim();

      if (text === "") {
        return;
      }

      const li = document.createElement("li");
      li.textContent = text;
      document.getElementById("liste").appendChild(li);

      document.getElementById("punkt").value = "";
    }
  </script>
</body>
</html>
