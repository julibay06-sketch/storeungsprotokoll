<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wartungs-Checkliste</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { text-align: center; }
    input { font-size: 18px; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ddd; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    li button { font-size: 13px; padding: 4px 10px; }
    li span { cursor: pointer; flex: 1; }
    .erledigt { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>Wartungs-Checkliste</h1>
  <input id="punkt" type="text" placeholder="Neuer Punkt, z. B. Ölstand prüfen">
  <button onclick="hinzufuegen()">Hinzufügen</button>
  <ul id="liste"></ul>

  <script>
    // Name, unter dem die Liste im Browser abgelegt wird
    const SCHLUESSEL = "checkliste";

    // Alle Punkte; jeder Punkt hat einen Text und einen Haken-Status
    let punkte = laden();

    // Liste aus dem Browser-Speicher holen
    function laden() {
      try {
        const gespeichert = localStorage.getItem(SCHLUESSEL);
        if (gespeichert === null) {
          return [];
        }
        return JSON.parse(gespeichert);
      } catch (fehler) {
        return [];
      }
    }

    // Liste im Browser-Speicher ablegen
    function speichern() {
      localStorage.setItem(SCHLUESSEL, JSON.stringify(punkte));
    }

    // Liste auf der Seite komplett neu aufbauen
    function anzeigen() {
      const liste = document.getElementById("liste");
      liste.innerHTML = "";

      for (let i = 0; i < punkte.length; i++) {
        const p = punkte[i];
        const li = document.createElement("li");

        // Der Text: Klick schaltet den Haken um
        const beschriftung = document.createElement("span");
        beschriftung.textContent = p.text;
        if (p.erledigt) {
          beschriftung.className = "erledigt";
        }
        beschriftung.onclick = function () {
          punkte[i].erledigt = !punkte[i].erledigt;
          speichern();
          anzeigen();
        };

        // Der Löschen-Button: entfernt den Punkt aus der Liste
        const knopf = document.createElement("button");
        knopf.textContent = "Löschen";
        knopf.onclick = function () {
          punkte.splice(i, 1);
          speichern();
          anzeigen();
        };

        li.appendChild(beschriftung);
        li.appendChild(knopf);
        liste.appendChild(li);
      }
    }

    function hinzufuegen() {
      const text = document.getElementById("punkt").value.trim();

      if (text === "") {
        return;
      }

      punkte.push({ text: text, erledigt: false });
      speichern();
      anzeigen();

      document.getElementById("punkt").value = "";
    }

    // Beim Öffnen der Seite gespeicherte Punkte anzeigen
    anzeigen();
  </script>
</body>
</html>
