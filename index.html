<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Störungsprotokoll</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { text-align: center; }
    input, select { font-size: 18px; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; margin-right: 8px; }
    .zaehler { font-size: 20px; margin: 16px 0; }
    .status { font-size: 14px; color: #666; min-height: 20px; }
    .fehler { color: #b00020; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ddd; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    li button { font-size: 13px; padding: 4px 10px; margin: 0; }
    .leer { color: #888; }
        .hoch { color: #b00020; font-weight: bold; }
    .mittel { color: #b26a00; }
    .niedrig { color: #2e7d32; }
    .kopfzeile { text-align: right; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Störungsprotokoll</h1>

  <!-- Bereich 1: Anmeldung (sichtbar, solange niemand angemeldet ist) -->
  <div id="login">
    <input id="email" type="email" placeholder="E-Mail">
    <input id="passwort" type="password" placeholder="Passwort" onkeydown="if (event.key === 'Enter') anmelden()">
    <button onclick="anmelden()">Anmelden</button>
    <p class="status" id="loginstatus"></p>
  </div>

  <!-- Bereich 2: das eigentliche Tool (nur nach erfolgreicher Anmeldung sichtbar) -->
  <div id="app" style="display:none">
    <div class="kopfzeile"><button onclick="abmelden()">Abmelden</button></div>

    <input id="anlage" type="text" placeholder="Anlagenname, z. B. WEA 3 Regensburg">
    <input id="text" type="text" placeholder="Störungstext, z. B. Getriebeöltemperatur zu hoch">
    <select id="prioritaet">
      <option value="hoch">Priorität hoch</option>
      <option value="mittel" selected>Priorität mittel</option>
      <option value="niedrig">Priorität niedrig</option>
    </select>

    <button onclick="melden()">Störung melden</button>
    <button onclick="alleLoeschen()">Alle löschen</button>

    <p class="zaehler">Gespeicherte Störungen: <strong id="zaehler">0</strong></p>
    <p class="status" id="status"></p>

        <select id="filter" onchange="anzeigen()">
      <option value="alle">Alle Prioritäten</option>
      <option value="hoch">Nur hoch</option>
      <option value="mittel">Nur mittel</option>
      <option value="niedrig">Nur niedrig</option>
    </select>
    <ul id="liste"></ul>
  </div>

  <script>
    // Verbindungsdaten zu Supabase (der publishable Key darf öffentlich im Code stehen)
    const SUPABASE_URL = "https://gkvsrnbtzkcwufkltxdg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eux3_BsGMaAZmJrY2kfo0A_jnEKGF5e";
    const TABELLE = SUPABASE_URL + "/rest/v1/stoerungen";

    // Das Login-Token (wie ein Zugangsausweis). Es bleibt, bis der Tab geschlossen wird.
    let token = sessionStorage.getItem("token");

    // Kopfzeilen für jede Anfrage: mit Token, wenn jemand angemeldet ist
    function kopf() {
      const k = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
      if (token) {
        k["Authorization"] = "Bearer " + token;
      }
      return k;
    }

    function meldung(text, istFehler) {
      const s = document.getElementById("status");
      s.textContent = text;
      s.className = istFehler ? "status fehler" : "status";
    }

    // Zwischen Anmeldeseite und Tool umschalten
    function ansichtZeigen() {
      const angemeldet = token !== null;
      document.getElementById("login").style.display = angemeldet ? "none" : "block";
      document.getElementById("app").style.display = angemeldet ? "block" : "none";
      if (angemeldet) {
        anzeigen();
      }
    }

    async function anmelden() {
      const email = document.getElementById("email").value.trim();
      const passwort = document.getElementById("passwort").value;
      const status = document.getElementById("loginstatus");

      if (email === "" || passwort === "") {
        status.textContent = "Bitte E-Mail und Passwort eingeben.";
        status.className = "status fehler";
        return;
      }

      try {
        const antwort = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: passwort })
        });
        if (!antwort.ok) {
          throw new Error("E-Mail oder Passwort falsch.");
        }
        const daten = await antwort.json();
        token = daten.access_token;
        sessionStorage.setItem("token", token);
        document.getElementById("passwort").value = "";
        status.textContent = "";
        ansichtZeigen();
      } catch (fehler) {
        status.textContent = fehler.message;
        status.className = "status fehler";
      }
    }

    function abmelden(hinweis) {
      token = null;
      sessionStorage.removeItem("token");
      const status = document.getElementById("loginstatus");
      status.textContent = hinweis || "";
      status.className = "status";
      ansichtZeigen();
    }

    // Prüft jede Serverantwort: Bei 401 ist die Sitzung abgelaufen
    function pruefen(antwort, fehlertext) {
      if (antwort.status === 401) {
        abmelden("Sitzung abgelaufen, bitte neu anmelden.");
        throw new Error("Nicht angemeldet");
      }
      if (!antwort.ok) {
        throw new Error(fehlertext + " (Status " + antwort.status + ")");
      }
    }

    async function laden() {
      const antwort = await fetch(TABELLE + "?select=*&order=created_at.desc", { headers: kopf() });
      pruefen(antwort, "Laden fehlgeschlagen");
      return await antwort.json();
    }

    async function anzeigen() {
      try {
        meldung("Lade Daten ...", false);
                const alle = await laden();
        const filter = document.getElementById("filter").value;
        let eintraege = alle;
        if (filter !== "alle") {
          eintraege = alle.filter(function (e) { return e.prioritaet === filter; });
        }
        const liste = document.getElementById("liste");
        liste.innerHTML = "";
        document.getElementById("zaehler").textContent = eintraege.length;

        if (eintraege.length === 0) {
          const leer = document.createElement("li");
                    li.className = e.prioritaet;
          leer.className = "leer";
          leer.textContent = "Noch keine Störungen erfasst.";
          liste.appendChild(leer);
        }

        for (const e of eintraege) {
          const li = document.createElement("li");

          const info = document.createElement("span");
          const zeit = new Date(e.created_at).toLocaleString("de-DE");
          info.textContent = zeit + " | [" + e.prioritaet.toUpperCase() + "] " + e.anlage + ": " + e.text;

          const knopf = document.createElement("button");
          knopf.textContent = "Löschen";
          knopf.onclick = function () { einzelnLoeschen(e.id); };

          li.appendChild(info);
          li.appendChild(knopf);
          liste.appendChild(li);
        }
        meldung("", false);
      } catch (fehler) {
        if (token) {
          meldung("Fehler: " + fehler.message, true);
        }
      }
    }

    async function melden() {
      const anlage = document.getElementById("anlage").value.trim();
      const text = document.getElementById("text").value.trim();
      const prioritaet = document.getElementById("prioritaet").value;

      if (anlage === "" || text === "") {
        alert("Bitte Anlagenname und Störungstext eingeben.");
        return;
      }

      try {
        const antwort = await fetch(TABELLE, {
          method: "POST",
          headers: { ...kopf(), "Prefer": "return=minimal" },
          body: JSON.stringify({ anlage: anlage, text: text, prioritaet: prioritaet })
        });
        pruefen(antwort, "Speichern fehlgeschlagen");
        document.getElementById("text").value = "";
        await anzeigen();
      } catch (fehler) {
        if (token) {
          meldung("Fehler: " + fehler.message, true);
        }
      }
    }

    async function einzelnLoeschen(id) {
      try {
        const antwort = await fetch(TABELLE + "?id=eq." + id, { method: "DELETE", headers: kopf() });
        pruefen(antwort, "Löschen fehlgeschlagen");
        await anzeigen();
      } catch (fehler) {
        if (token) {
          meldung("Fehler: " + fehler.message, true);
        }
      }
    }

    async function alleLoeschen() {
      if (!confirm("Wirklich alle Einträge löschen?")) {
        return;
      }
      try {
        const antwort = await fetch(TABELLE + "?id=gt.0", { method: "DELETE", headers: kopf() });
        pruefen(antwort, "Löschen fehlgeschlagen");
        await anzeigen();
      } catch (fehler) {
        if (token) {
          meldung("Fehler: " + fehler.message, true);
        }
      }
    }

    // Beim Öffnen der Seite: Anmeldeseite oder Tool zeigen, je nach Token
    ansichtZeigen();
  </script>
</body>
</html>
