<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Störungsprotokoll</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    h1 { text-align: center; }
    input { font-size: 18px; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; margin-right: 8px; }
    .zaehler { font-size: 20px; margin: 16px 0; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ddd; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    li button { font-size: 13px; padding: 4px 10px; margin: 0; }
    .leer { color: #888; }
  </style>
</head>
<body>
  <h1>Störungsprotokoll</h1>

  <input id="anlage" type="text" placeholder="Anlagenname, z. B. WEA 3 Regensburg">
  <input id="text" type="text" placeholder="Störungstext, z. B. Getriebeöltemperatur zu hoch">

  <button onclick="melden()">Störung melden</button>
  <button onclick="alleLoeschen()">Alle löschen</button>

  <p class="zaehler">Gespeicherte Störungen: <strong id="zaehler">0</strong></p>

  <ul id="liste"></ul>

  <script>
    // Speicher-Schlüssel (wie eine Adresse im Speicher)
    const SCHLUESSEL = "stoerungen";

    // Alle Einträge aus dem Browser-Speicher laden
    function laden() {
      const gespeichert = localStorage.getItem(SCHLUESSEL);
      if (gespeichert === null) {
        return [];
      }
      return JSON.parse(gespeichert);
    }

    // Alle Einträge im Browser-Speicher sichern
    function speichern(eintraege) {
      localStorage.setItem(SCHLUESSEL, JSON.stringify(eintraege));
    }

    // Die Liste auf der Seite neu aufbauen
    function anzeigen() {
      const eintraege = laden();
      const liste = document.getElementById("liste");
      liste.innerHTML = "";
      document.getElementById("zaehler").textContent = eintraege.length;

      if (eintraege.length === 0) {
        const leer = document.createElement("li");
        leer.className = "leer";
        leer.textContent = "Noch keine Störungen erfasst.";
        liste.appendChild(leer);
        return;
      }

      // Neueste zuerst anzeigen
      for (let i = eintraege.length - 1; i >= 0; i--) {
        const e = eintraege[i];
        const li = document.createElement("li");

        const info = document.createElement("span");
        info.textContent = e.zeit + " | " + e.anlage + ": " + e.text;

        const knopf = document.createElement("button");
        knopf.textContent = "Löschen";
        knopf.onclick = function () { einzelnLoeschen(i); };

        li.appendChild(info);
        li.appendChild(knopf);
        liste.appendChild(li);
      }
    }

    function melden() {
      const anlage = document.getElementById("anlage").value.trim();
      const text = document.getElementById("text").value.trim();

      if (anlage === "" || text === "") {
        alert("Bitte Anlagenname und Störungstext eingeben.");
        return;
      }

      const eintraege = laden();
      eintraege.push({
        zeit: new Date().toLocaleString("de-DE"),
        anlage: anlage,
        text: text
      });
      speichern(eintraege);

      document.getElementById("text").value = "";
      anzeigen();
    }

    function einzelnLoeschen(index) {
      const eintraege = laden();
      eintraege.splice(index, 1);
      speichern(eintraege);
      anzeigen();
    }

    function alleLoeschen() {
      if (confirm("Wirklich alle Einträge löschen?")) {
        speichern([]);
        anzeigen();
      }
    }

    // Beim Öffnen der Seite sofort anzeigen, was gespeichert ist
    anzeigen();
  </script>
</body>
</html>
